# Build workflow for TempoVR
# Based on https://github.com/Malcolmnixon/GodotCIBuildDemo
---

name: Build TempoVR

# Trigger rules
on:
  push:
    branches: [main, develop, ci-workflow, workout]
    tags: ['v*']
  pull_request:
    branches: [main, workout]
  workflow_dispatch:

# Environment variables
env:
  # Configure Godot version (must match project.godot config/features)
  GODOT_VERSION: 4.5.1
  # OpenXR Vendors version (for VR builds)
  OPENXR_VENDORS_VERSION: 4.2.2-stable

# CI jobs
jobs:
  # Build job (Matrix build for all exports)
  build:
    name: Building for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Export for Windows
          - name: Windows
            os: ubuntu-22.04
            platform: windows
            export-preset: Windows
            export-type: release
            export-folder: build/windows
            archive: Windows

          # Export for Linux
          - name: Linux
            os: ubuntu-22.04
            platform: linux
            export-preset: Linux
            export-type: release
            export-folder: build/linux
            archive: Linux

          # Export for Android Quest
          - name: Android-Quest
            os: ubuntu-22.04
            platform: android
            export-preset: Android Quest CI
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-quest
            archive: Android-Quest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install the OpenXR Vendors Plugin (required for VR builds)
      - name: Install OpenXR Vendors Plugin
        shell: bash
        run: |
          curl -L -O https://github.com/GodotVR/godot_openxr_vendors/releases/download/${{ env.OPENXR_VENDORS_VERSION }}/godotopenxrvendorsaddon.zip
          unzip -o godotopenxrvendorsaddon.zip -d godotopenxrvendorsaddon
          mkdir -p src/addons
          rm -rf src/addons/godotopenxrvendors
          mv godotopenxrvendorsaddon/asset/addons/godotopenxrvendors src/addons/godotopenxrvendors
          rm godotopenxrvendorsaddon.zip
          rm -rf godotopenxrvendorsaddon
          echo "OpenXR Vendors Plugin installed:"
          ls -la src/addons/godotopenxrvendors/

      # Download pre-shipped BeatSaver levels (ExpertPlus only)
      # These levels will be:
      # - Android: Bundled into APK (res://Levels/) - stays in src/Levels/ during export
      # - Non-Android: Copied externally next to executable - moved out before export to avoid bundling
      - name: Download Pre-shipped Levels
        shell: bash
        run: |
          mkdir -p src/Levels/a908 src/Levels/a907
          
          # a908 - TheFatRat - Unity (ExpertPlus)
          curl -sL "https://r2cdn.beatsaver.com/296946437e2194823129d88e7c457202e4c7f281.zip" -o /tmp/a908.zip
          unzip -j /tmp/a908.zip ExpertPlusStandard.dat cover.jpg song.egg info.dat -d src/Levels/a908/
          mv src/Levels/a908/song.egg src/Levels/a908/song.ogg
          python3 scripts/patch_level_info.py src/Levels/a908/info.dat
          
          # a907 - TheFatRat - Monody (ExpertPlus)
          curl -sL "https://r2cdn.beatsaver.com/8e82872941abe8c99e9ac86d9c063fc5aee57d52.zip" -o /tmp/a907.zip
          unzip -j /tmp/a907.zip ExpertPlusStandard.dat cover.jpg song.egg info.dat -d src/Levels/a907/
          mv src/Levels/a907/song.egg src/Levels/a907/song.ogg
          python3 scripts/patch_level_info.py src/Levels/a907/info.dat
          
          echo "Pre-shipped levels installed:"
          ls -la src/Levels/

      # If targeting android then install JDK
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # If targeting android then install Android SDK
      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      # If targeting android then install Android SDK Packages
      - name: Install Android SDK Packages
        if: matrix.platform == 'android'
        run: >
          sdkmanager
          "platform-tools"
          "build-tools;34.0.0"
          "platforms;android-34"
          "cmdline-tools;latest"
          "cmake;3.10.2.4988404"
          "ndk;23.2.8568313"

      # Setup Godot
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # Import Godot Project
      - name: Initial Godot Import
        shell: bash
        run: |
          cd src
          godot --headless --import || exit 0

      # Move Levels folder out of project for non-Android builds to prevent bundling
      # Android: Levels stay in src/Levels/ to get bundled into APK (res://Levels/)
      # Non-Android: Levels moved out before export, then copied externally (avoids bundling into PCK)
      - name: Move Levels Out of Project (Non-Android Only)
        if: matrix.platform != 'android'
        shell: bash
        run: |
          mv src/Levels /tmp/Levels
          echo "Moved Levels folder to /tmp/Levels to prevent bundling into PCK"

      # Export project (with android build template if needed)
      - name: Export Godot Project
        shell: bash
        run: |
          cd src
          godot --headless ${{ matrix.export-args }} --export-${{ matrix.export-type }} "${{ matrix.export-preset }}"

      # Restore Levels folder for non-Android builds so it can be copied externally
      - name: Restore Levels Folder (Non-Android Only)
        if: matrix.platform != 'android'
        shell: bash
        run: |
          mv /tmp/Levels src/Levels
          echo "Restored Levels folder from /tmp/Levels"

      # Copy pre-shipped levels to build output (external filesystem access)
      # For non-Android: Copy Levels externally next to executable (not bundled in PCK)
      # For Android: Levels are already bundled in APK (res://Levels/), no external copy needed
      - name: Copy Pre-shipped Levels to Build
        if: matrix.platform != 'android'
        shell: bash
        run: |
          cp -r src/Levels src/${{ matrix.export-folder }}/Levels
          echo "Copied Levels folder to build output:"
          ls -la src/${{ matrix.export-folder }}/Levels/

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}-Artifacts
          path: |
            src/${{ matrix.export-folder }}
            !**/.gitignore

      # Compress project (if building release tag)
      - name: Compress Project
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        run: |
          cd src/${{ matrix.export-folder }}
          7z a -tzip ${{ matrix.archive }}.zip . -x'!.gitignore'

      # Publish release (if building release tag)
      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        with:
          allowUpdates: true
          artifacts: 'src/${{ matrix.export-folder }}/${{ matrix.archive }}.zip'
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
