# Build workflow for TempoVR
# Based on https://github.com/Malcolmnixon/GodotCIBuildDemo
---

name: Build TempoVR

# Trigger rules
on:
  push:
    branches: [main, develop, ci-workflow, workout]
    tags: ['v*']
  pull_request:
    branches: [main, workout]
  workflow_dispatch:

# Environment variables
env:
  # Configure Godot version (must match project.godot config/features)
  # Note: Using 4.5.1 as setup-godot requires minor version
  GODOT_VERSION: 4.5.1

# CI jobs
jobs:
  # Build job (Matrix build for all exports)
  build:
    name: Building for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Export for Windows
          - name: Windows
            os: ubuntu-22.04
            platform: windows
            export-preset: Windows
            export-type: release
            export-folder: build/windows
            archive: Windows

          # Export for Linux
          - name: Linux
            os: ubuntu-22.04
            platform: linux
            export-preset: Linux
            export-type: release
            export-folder: build/linux
            archive: Linux

          # Export for Android Quest
          - name: Android-Quest
            os: ubuntu-22.04
            platform: android
            export-preset: Android Quest CI
            export-type: debug
            export-folder: build/android-quest
            archive: Android-Quest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # If targeting android then install JDK
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # If targeting android then install Android SDK
      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      # If targeting android then install Android SDK Packages
      - name: Install Android SDK Packages
        if: matrix.platform == 'android'
        run: >
          sdkmanager
          "platform-tools"
          "build-tools;34.0.0"
          "platforms;android-34"
          "cmdline-tools;latest"
          "cmake;3.10.2.4988404"
          "ndk;23.2.8568313"

      # Setup Godot
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # Configure Android environment for Godot
      - name: Configure Android Environment
        if: matrix.platform == 'android'
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.2.8568313" >> $GITHUB_ENV

      # Generate debug keystore for Android
      - name: Generate Debug Keystore
        if: matrix.platform == 'android'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore created at ~/.android/debug.keystore"

      # Configure Godot editor settings for Android
      - name: Configure Editor Settings
        if: matrix.platform == 'android'
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Created editor settings with:"
          echo "  ANDROID_HOME=${ANDROID_HOME}"
          echo "  JAVA_HOME=${JAVA_HOME}"
          cat ~/.config/godot/editor_settings-4.tres

      # Import Godot Project
      - name: Initial Godot Import
        shell: bash
        run: |
          cd src
          godot --headless --import || exit 0

      # Install Android build template
      - name: Install Android Build Template
        if: matrix.platform == 'android'
        shell: bash
        run: |
          cd src
          godot --headless --export-android-install-build-template || exit 0

      # Export project
      - name: Export Godot Project
        shell: bash
        run: |
          cd src
          godot --headless --export-${{ matrix.export-type }} "${{ matrix.export-preset }}"

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}-Artifacts
          path: |
            src/${{ matrix.export-folder }}/*.*
            !**/.gitignore

      # Compress project (if building release tag)
      - name: Compress Project
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        run: |
          cd src/${{ matrix.export-folder }}
          7z a -tzip ${{ matrix.archive }}.zip *.* -x'!.gitignore'

      # Publish release (if building release tag)
      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        with:
          allowUpdates: true
          artifacts: 'src/${{ matrix.export-folder }}/${{ matrix.archive }}.zip'
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
